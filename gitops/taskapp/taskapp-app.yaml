apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskapp
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Erhokhon/capstone-phoenix.git
    targetRevision: main
    path: gitops/taskapp

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
